name: Build PersonalComputerDeskOrganizer

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "deploy/**", "**.md" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/PersonalComputerDeskOrganizer/PersonalComputerDeskOrganizer.csproj

      - name: Publish (self-contained, single exe)
        run: dotnet publish src/PersonalComputerDeskOrganizer/PersonalComputerDeskOrganizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip the output
        run: Compress-Archive -Path publish\* -DestinationPath PersonalComputerDeskOrganizer.zip

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create GitHub Release
        run: gh release create latest PersonalComputerDeskOrganizer.zip --title "PersonalComputerDeskOrganizer — dernière version" --notes "Build automatique du dernier commit sur main." --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
