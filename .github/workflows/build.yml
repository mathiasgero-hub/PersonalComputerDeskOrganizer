name: Build PersonalComputerDeskOrganizer

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "deploy/**", "**.md" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      APP_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/PersonalComputerDeskOrganizer/PersonalComputerDeskOrganizer.csproj

      - name: Publish (self-contained, single exe)
        run: dotnet publish src/PersonalComputerDeskOrganizer/PersonalComputerDeskOrganizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ env.APP_VERSION }} -o publish

      - name: Zip the output
        run: Compress-Archive -Path publish\* -DestinationPath PersonalComputerDeskOrganizer.zip

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DMyAppVersion=${{ env.APP_VERSION }} installer\PersonalComputerDeskOrganizer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create GitHub Release
        run: gh release create latest installer-output\PersonalComputerDeskOrganizer-Setup.exe PersonalComputerDeskOrganizer.zip --title "PersonalComputerDeskOrganizer ${{ env.APP_VERSION }}" --notes "Build automatique du dernier commit sur main." --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
